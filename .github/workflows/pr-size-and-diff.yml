name: PR Size and Diff
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff Calculator Action
        uses: themoin/diff-calculator@v0.2.3
        with:
          source: ${{ github.event.pull_request.head.sha }}
          target: ${{ github.event.pull_request.base.sha }}
      - name: limit-size
        uses: 7PH/limit-size@v1.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: "**/*: 25mb"
